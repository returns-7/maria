name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test seed email index generator
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Spotless
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon

      - name: Start notification test Redis
        run: docker run --detach --name notification-test-redis --publish 127.0.0.1:6379:6379 redis:7-alpine redis-server --requirepass ci

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
        env:
          DB_URL: jdbc:mariadb://localhost:1/ci
          DB_USERNAME: ci
          DB_PASSWORD: ci
          REDIS_HOST: localhost
          REDIS_PASSWORD: ci
          JWT_SECRET: Y2ktb25seS1mYWtlLXNlY3JldC0zMi1ieXRlcy1sb25nISE=
          EXIM_API_KEY: ci
          KIS_APP_KEY: ci
          KIS_APP_SECRET: ci
          RETURNS_SECURITY_URL: http://localhost:1
          MYDATA_URL: http://localhost:1
          CI_PEPPER: ci
          SIGNUP_REDIS_TEST_HOST: localhost
          SIGNUP_REDIS_TEST_PASSWORD: ci
          NOTIFICATION_REDIS_TEST_HOST: localhost
          NOTIFICATION_REDIS_TEST_PASSWORD: ci
