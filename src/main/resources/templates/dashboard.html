<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>MARIA</title>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">대시보드</div>

<div layout:fragment="content">
    <div id="dashboardLoading" class="dash-loading">불러오는 중...</div>
    <div id="dashboardError" class="dash-error" style="display:none"></div>

    <div id="dashboardBody" style="display:none">
        <div class="kpi-grid">
            <div class="card kpi-card">
                <div class="kpi-label">심사대기 계좌</div>
                <div class="kpi-value" id="kpiPending">-</div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-label">가환전 미확정 건수</div>
                <div class="kpi-value" id="kpiProvisional">-</div>
            </div>
            <div class="card kpi-card kpi-card-danger">
                <div class="kpi-label">5천만원 근접 계좌 (80%+)</div>
                <div class="kpi-value kpi-value-danger" id="kpiNearLimit">-</div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-label">오늘 누적 매도 총액</div>
                <div class="kpi-value kpi-value-amount" id="kpiTodaySell">-</div>
            </div>
        </div>

        <div class="dash-row">
            <div class="dash-main">
                <div class="card batch-bar">
                    <div>
                        <div class="batch-bar-label">최근 정산 배치</div>
                        <div class="batch-bar-value" id="batchExecutedAt">-</div>
                    </div>
                    <div class="topbar-divider" style="height:26px"></div>
                    <span class="status-badge" id="batchStatus">-</span>
                </div>

                <div class="card">
                    <div class="section-header">
                        <span>처리 계좌 목록</span>
                        <span class="section-sub">심사대기 + 한도 80% 이상</span>
                    </div>
                    <table class="dash-table">
                        <thead>
                        <tr>
                            <th>계좌번호 / 고객명</th>
                            <th>상태</th>
                            <th>한도 사용률</th>
                        </tr>
                        </thead>
                        <tbody id="priorityAccountsBody">
                        <tr>
                            <td colspan="3" class="dash-empty">불러오는 중...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="dash-side">
                <div class="card side-card">
                    <div class="section-header">오늘 처리 완료</div>
                    <div class="today-processed">
                        <div class="today-processed-item today-approved">
                            <div class="today-processed-count" id="kpiApproved">-</div>
                            <div class="today-processed-label">승인</div>
                        </div>
                        <div class="today-processed-item today-rejected">
                            <div class="today-processed-count" id="kpiRejected">-</div>
                            <div class="today-processed-label">반려</div>
                        </div>
                    </div>
                </div>

                <div class="card side-card">
                    <div class="section-header">최근 감사로그</div>
                    <div id="recentAuditLogs" class="audit-log-list">불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/dashboard.js}"></script>
</th:block>
</body>
</html>
