<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/tax-calculation.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">세액 계산</div>

<div layout:fragment="content">
    <div id="taxLoading" class="tax-loading">불러오는 중...</div>
    <div id="taxError" class="tax-error" style="display:none"></div>

    <div id="taxBody" style="display:none">
        <div class="kpi-grid">
            <div class="card kpi-card">
                <div class="kpi-label">전체 스냅샷</div>
                <div class="kpi-value" id="kpiTotal">-</div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-label">과세대상 (최종세액 > 0)</div>
                <div class="kpi-value" id="kpiTaxable">-</div>
            </div>
            <div class="card kpi-card kpi-card-danger">
                <div class="kpi-label">세제혜택 일부감액·배제</div>
                <div class="kpi-value kpi-value-danger" id="kpiReduced">-</div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-label">과세대상 최종세액 합계</div>
                <div class="kpi-value kpi-value-amount" id="kpiTaxSum">-</div>
            </div>
        </div>

        <section id="taxDetail" class="card tax-detail">
            <div class="tax-detail-header">
                <div>
                    <strong id="detailAccountNo">계좌를 선택하세요</strong>
                    <p class="tax-detail-description" id="detailDescription">목록에서 행을 클릭하면 실시간 계산 결과가 여기 표시됩니다.</p>
                </div>
                <span id="detailStaleBadge" class="tax-stale-badge" style="display:none">배치값과 다름</span>
            </div>
            <div class="tax-detail-grid">
                <div><div class="tax-detail-item-label">[1] 가중매도금액</div><div id="detailWeightedSell" class="tax-detail-item-value">-</div></div>
                <div><div class="tax-detail-item-label">[1] 조정전공제액</div><div id="detailWeightedGain" class="tax-detail-item-value">-</div></div>
                <div><div class="tax-detail-item-label">[2] 외부 순매수금액</div><div id="detailExternalAmount" class="tax-detail-item-value">-</div></div>
                <div><div class="tax-detail-item-label">[3] 조정비율</div><div id="detailAdjustRatio" class="tax-detail-item-value">-</div></div>
                <div><div class="tax-detail-item-label">[4] 최종공제액</div><div id="detailFinalDeduction" class="tax-detail-item-value">-</div></div>
                <div><div class="tax-detail-item-label">[5] 총양도소득(비가중)</div><div id="detailOriginalGain" class="tax-detail-item-value">-</div></div>
                <div><div class="tax-detail-item-label">[5] 최종세액</div><div id="detailFinalTax" class="tax-detail-item-value tax-detail-item-value-highlight">-</div></div>
                <div><div class="tax-detail-item-label">기준시각</div><div id="detailAsOf" class="tax-detail-item-value">-</div></div>
            </div>
        </section>

        <div class="card">
            <div class="section-header">
                <span>세액 스냅샷 목록</span>
                <span class="section-sub" id="taxSnapshotCount"></span>
                <input type="text" id="taxSearchInput" class="tax-search-input" placeholder="계좌번호 또는 고객명 검색">
                <button type="button" id="triggerBatch" class="tax-batch-btn">배치 수동 실행</button>
                <span id="batchTriggerResult" class="tax-batch-result"></span>
            </div>
            <table class="tax-table">
                <thead>
                <tr>
                    <th>계좌번호 / 고객명</th>
                    <th>세제혜택</th>
                    <th>가중매도금액</th>
                    <th>조정전공제액</th>
                    <th>조정비율</th>
                    <th>최종공제액</th>
                    <th>최종세액</th>
                    <th>산출시각</th>
                </tr>
                </thead>
                <tbody id="taxSnapshotBody">
                <tr>
                    <td colspan="8" class="tax-empty">불러오는 중...</td>
                </tr>
                </tbody>
            </table>
            <div class="tax-pagination" id="taxPagination" style="display:none">
                <button id="previousTaxPage" class="btn" type="button">이전</button>
                <span id="taxPageInfo"></span>
                <button id="nextTaxPage" class="btn" type="button">다음</button>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/tax-calculation.js}"></script>
</th:block>
</body>
</html>
