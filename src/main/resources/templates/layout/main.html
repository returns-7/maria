<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/admin/favicon.png}">
    <title>RIA ADMIN · Returns.</title>
    <!-- 테마는 화면이 그려지기 전에 정한다 (저장 키: ria-admin-theme) -->
    <script>
        (function () {
            var theme = "light";
            try { if (localStorage.getItem("ria-admin-theme") === "dark") theme = "dark"; } catch (e) {}
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/admin/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/admin/shell.css}">
    <link rel="stylesheet" th:href="@{/css/admin/components.css}">
    <th:block layout:fragment="pageStyles"></th:block>
</head>
<body>
<!-- is-pending: layout.js가 로그인 확인(/api/admin/me)을 마칠 때까지 화면 전체를 숨긴다 -->
<div class="adm-shell is-pending" id="admShell">
    <div class="adm-shell-row">

        <aside class="adm-side" id="admSide">
            <div class="adm-side-brand">
                <div class="adm-side-brand-full">
                    <img th:src="@{/images/admin/logo-wordmark-white.png}" alt="Returns. MORE VALUE TOMORROW">
                    <span class="adm-side-tag">RIA ADMIN</span>
                </div>
                <img class="adm-side-brand-symbol" th:src="@{/images/admin/logo-symbol-white.png}" alt="Returns.">
            </div>

            <div class="adm-side-search">
                <div class="adm-side-search-box">
                    <svg class="adm-side-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="admSideSearch" autocomplete="off" placeholder="화면번호 · 메뉴 검색"
                           aria-label="화면번호 · 메뉴 검색">
                    <span class="adm-side-search-key">Ctrl K</span>
                </div>
                <div class="adm-side-results" id="admSideResults" role="listbox" hidden></div>
            </div>

            <nav class="adm-side-nav" id="admSideNav" aria-label="주 메뉴">

                <div class="adm-side-group is-fav" data-group="즐겨찾기" id="admFavGroup">
                    <button type="button" class="adm-side-grouphead" aria-expanded="true">
                        <span class="adm-side-grouplabel">즐겨찾기</span>
                        <span class="adm-side-groupsum" hidden></span>
                        <span class="adm-side-caret">▾</span>
                    </button>
                    <div class="adm-side-groupbody"><div class="adm-side-groupinner" id="admFavList"></div></div>
                    <button type="button" class="adm-side-groupicon" title="즐겨찾기" aria-label="즐겨찾기">
                        <span class="adm-side-bar"></span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <span class="adm-side-dot" hidden></span>
                    </button>
                </div>

                <div class="adm-side-group" data-group="심사 · 계좌">
                    <button type="button" class="adm-side-grouphead" aria-expanded="false">
                        <span class="adm-side-grouplabel">심사 · 계좌</span>
                        <span class="adm-side-groupsum" hidden></span>
                        <span class="adm-side-caret">▸</span>
                    </button>
                    <div class="adm-side-groupbody"><div class="adm-side-groupinner">
                        <a class="adm-side-item" th:href="@{/admin/account}" data-no="1101" data-label="계좌 관리" title="[1101] 계좌 관리"
                           th:classappend="${activePath == '/admin/account'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>

                    <button type="button" class="adm-side-groupicon" title="심사 · 계좌" aria-label="심사 · 계좌">

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>

                        <span class="adm-side-caret">▸</span>
                    </button>
                    <div class="adm-side-groupbody"><div class="adm-side-groupinner">
                        <a class="adm-side-item" th:href="@{/admin/inbound}" data-no="1201" data-label="입고 관리" title="[1201] 입고 관리"
                           th:classappend="${activePath == '/admin/inbound'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>

                            <span class="adm-side-label">매도 · 환전</span>

                        <a class="adm-side-item" th:href="@{/admin/settlement}" data-no="1203" data-label="정산 배치" title="[1203] 정산 배치"
                           th:classappend="${activePath == '/admin/settlement'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
                            <span class="adm-side-label">정산 배치</span>

                    </div></div>
                    <button type="button" class="adm-side-groupicon" title="입고 · 매도" aria-label="입고 · 매도">
                        <span class="adm-side-bar"></span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                        <span class="adm-side-dot" hidden></span>
                    </button>
                </div>

                <div class="adm-side-group" data-group="세금 · 리스크">
                    <button type="button" class="adm-side-grouphead" aria-expanded="false">
                        <span class="adm-side-grouplabel">세금 · 리스크</span>
                        <span class="adm-side-groupsum" hidden></span>
                        <span class="adm-side-caret">▸</span>
                    </button>
                    <div class="adm-side-groupbody"><div class="adm-side-groupinner">
                        <a class="adm-side-item" th:href="@{/admin/target-products}" data-no="1301" data-label="외부 감시" title="[1301] 외부 감시"
                           th:classappend="${activePath == '/admin/target-products'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <span class="adm-side-label">외부 감시</span>
                        </a>
                        <a class="adm-side-item" th:href="@{/admin/tax}" data-no="1302" data-label="세액 계산" title="[1302] 세액 계산"
                           th:classappend="${activePath == '/admin/tax'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg>
                            <span class="adm-side-label">세액 계산</span>
                        </a>
                    </div></div>
                    <button type="button" class="adm-side-groupicon" title="세금 · 리스크" aria-label="세금 · 리스크">
                        <span class="adm-side-bar"></span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h.01M12 19h.01M16 19h.01"/></svg>
                        <span class="adm-side-dot" hidden></span>
                    </button>
                </div>

                <div class="adm-side-group" data-group="자산 · 인출">
                    <button type="button" class="adm-side-grouphead" aria-expanded="false">
                        <span class="adm-side-grouplabel">자산 · 인출</span>
                        <span class="adm-side-groupsum" hidden></span>
                        <span class="adm-side-caret">▸</span>
                    </button>
                    <div class="adm-side-groupbody"><div class="adm-side-groupinner">
                        <a class="adm-side-item" th:href="@{/admin/domestic-investment}" data-no="1401" data-label="국내투자 현황" title="[1401] 국내투자 현황"
                           th:classappend="${activePath == '/admin/domestic-investment'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                            <span class="adm-side-label">국내투자 현황</span>
                        </a>
                        <a class="adm-side-item" th:href="@{/admin/withdrawals}" data-no="1402" data-label="인출 관리" title="[1402] 인출 관리"
                           th:classappend="${activePath == '/admin/withdrawals'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                            <span class="adm-side-label">인출 관리</span>
                        </a>
                        <a class="adm-side-item" th:href="@{/admin/fund-flow}" data-no="1405" data-label="자금 환류 대시보드" title="[1405] 자금 환류 대시보드"
                           th:classappend="${activePath == '/admin/fund-flow'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                            <span class="adm-side-label">자금 환류 대시보드</span>
                        </a>
                        <!-- 계좌 해지 자동 처리 전환으로 관리자 메뉴에서는 해지관리 화면을 노출하지 않는다. (팀 결정)
                             화면(/admin/account-closures)과 컨트롤러는 그대로 두고 링크만 숨긴다.
                             hidden 이면 Ctrl K 검색·접힌 사이드바 팝업·그룹 배지 합산에서도 빠진다 (layout.js 가 [hidden] 항목을 건너뜀). -->
                        <a class="adm-side-item" hidden th:href="@{/admin/account-closures}" data-no="1403" data-label="계좌 해지 관리" title="[1403] 계좌 해지 관리"
                           th:classappend="${activePath == '/admin/account-closures'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/></svg>
                            <span class="adm-side-label">계좌 해지 관리</span>
                        </a>
                    </div></div>
                    <button type="button" class="adm-side-groupicon" title="자산 · 인출" aria-label="자산 · 인출">
                        <span class="adm-side-bar"></span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                        <span class="adm-side-dot" hidden></span>
                    </button>
                </div>

                <div class="adm-side-group" data-group="시스템">
                    <button type="button" class="adm-side-grouphead" aria-expanded="false">
                        <span class="adm-side-grouplabel">시스템</span>
                        <span class="adm-side-groupsum" hidden></span>
                        <span class="adm-side-caret">▸</span>
                    </button>
                    <div class="adm-side-groupbody"><div class="adm-side-groupinner">
                        <a class="adm-side-item" th:href="@{/admin/audit-log}" data-no="9002" data-label="감사 로그" title="[9002] 감사 로그"
                           th:classappend="${activePath == '/admin/audit-log'} ? ' is-active' : ''">
                            <span class="adm-side-bar"></span>
                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>
                            <span class="adm-side-label">감사 로그</span>
                        </a>
                        <a class="adm-side-item" th:href="@{/admin/admin-users}" data-no="9003" data-label="관리자 계정 관리" title="[9003] 관리자 계정 관리"
                           th:classappend="${activePath == '/admin/admin-users'} ? ' is-active' : ''">

                            <svg class="adm-side-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            <span class="adm-side-label">관리자 계정 관리</span>
                        </a>
                    </div></div>
                    <button type="button" class="adm-side-groupicon" title="시스템" aria-label="시스템">
                        <span class="adm-side-bar"></span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                        <span class="adm-side-dot" hidden></span>
                    </button>
                </div>
            </nav>

            <button type="button" class="adm-side-toggle" id="admSideToggle" title="메뉴 접기/펼치기">
                <svg class="adm-side-toggle-ico is-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
                <svg class="adm-side-toggle-ico is-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg>
                <span class="adm-side-toggle-text">메뉴 접기</span>

        <!-- 접힌 사이드바에서 그룹 아이콘에 마우스를 올리면 뜨는 메뉴 (layout.js가 채운다) -->
        <div class="adm-side-fly" id="admSideFly" hidden></div>

        <div class="adm-col">
            <header class="adm-top">
                <nav class="breadcrumb adm-crumb" aria-label="현재 위치">
                    <span class="adm-crumb-root">RIA 관리 시스템</span>
                    <span class="adm-crumb-sep">&rsaquo;</span>
                    <span class="breadcrumb-current" layout:fragment="breadcrumb">페이지</span>
                </nav>
                <button type="button" class="adm-top-clock" id="clockButton" disabled>
                    <span class="adm-top-clock-mark"></span>
                    <span class="adm-top-clock-label">기준 시각</span>
                    <span class="adm-top-clock-value" id="clockValue">-</span>
                </button>
                <div class="adm-top-spacer"></div>
                <span class="adm-top-admin" id="adminBadge">
                    <span class="adm-top-name" id="adminName">-</span>
                    <span class="adm-top-role" id="adminRole" hidden></span>
                </span>
                <div class="adm-fontsize" role="group" aria-label="글자 크기">
                    <button type="button" data-fs-step="-1" aria-label="글자 작게">가-</button>
                    <button type="button" data-fs-step="reset" aria-label="글자 보통">가</button>
                    <button type="button" data-fs-step="1" aria-label="글자 크게">가+</button>
                </div>
                <button type="button" class="adm-top-theme" id="themeToggle">
                    <svg class="adm-top-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-2.93 1.41-1.41M17.66 6.34l1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41"/></svg>
                    <svg class="adm-top-theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
                <button type="button" class="adm-top-logout" id="logoutLink">로그아웃</button>
            </header>

            <!-- 열어 본 화면 탭 줄 (layout.js 가 sessionStorage ria-admin-tabs 로 채운다. 탭은 링크 이동이고 화면 상태는 저장하지 않는다) -->
            <div class="adm-stabs" id="admTabs">
                <button type="button" class="adm-stabs-arrow is-prev" id="admTabPrev" aria-label="이전 탭" hidden>&lsaquo;</button>
                <div class="adm-stabs-strip" id="admTabStrip" role="tablist" aria-label="열어 본 화면"></div>
                <button type="button" class="adm-stabs-arrow is-next" id="admTabNext" aria-label="다음 탭" hidden>&rsaquo;</button>
                <div class="adm-stabs-more">
                    <button type="button" class="adm-stabs-morebtn" id="admTabListBtn" aria-haspopup="true" aria-expanded="false">열린 화면 <b id="admTabCount">1</b> ▾</button>
                    <div class="adm-stabs-backdrop" id="admTabListBack" hidden></div>
                    <div class="adm-stabs-list" id="admTabList" hidden>
                        <div class="adm-stabs-list-head" id="admTabListHead">열린 화면 1 / 10</div>
                        <div class="adm-stabs-list-body" id="admTabListBody"></div>
                        <button type="button" class="adm-stabs-list-clear" id="admTabClearAll">모두 닫기</button>
                    </div>
                </div>
            </div>
            <div class="adm-stabs-backdrop is-ctx" id="admTabCtxBack" hidden></div>
            <div class="adm-stabs-ctx" id="admTabCtx" role="menu" hidden></div>

            <main class="content adm-main">
                <div layout:fragment="content">페이지 내용이 여기 들어갑니다.</div>
            </main>
        </div>
    </div>

    <footer class="adm-status">
        <span class="adm-status-cell" id="admStatusUser">-</span>
        <span class="adm-status-cell">업무일자 <span id="admStatusBizDate">-</span></span>
        <span class="adm-status-msg" id="admStatusMsg"></span>
    </footer>

    <!-- 업무시각 설정 모달 (ADMIN만 열림). id·동작은 기존 그대로 -->
    <div class="adm-modal-backdrop" id="clockModal" hidden>
        <section class="adm-modal" role="dialog" aria-modal="true" aria-labelledby="clockModalTitle">
            <div class="adm-modal-head">
                <h2 id="clockModalTitle">시스템 업무시각 설정</h2>
                <button type="button" class="adm-modal-close" id="clockModalClose" aria-label="닫기">&times;</button>
            </div>
            <div class="adm-modal-body">
                <p class="adm-modal-desc">설정한 시각부터 시스템 업무시각이 계속 흐릅니다.</p>
                <div class="adm-modal-form">
                    <label class="adm-modal-k" for="clockDatetime">변경할 업무시각</label>
                    <div class="adm-modal-v"><input type="datetime-local" id="clockDatetime" step="60"></div>
                    <label class="adm-modal-k" for="clockReasonCode">변경 사유</label>
                    <div class="adm-modal-v"><input type="text" id="clockReasonCode" maxlength="50"
                                                    placeholder="예: DEMO_TIME_CHANGE"></div>
                </div>
                <p class="adm-modal-help">변경 이력은 감사로그에 기록됩니다.</p>
            </div>
            <div class="adm-modal-actions">
                <button type="button" class="adm-btn" id="clockModalCancel">취소</button>
                <button type="button" class="adm-btn adm-btn-primary" id="clockApplyButton">업무시각 적용</button>
            </div>
        </section>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</div>

<script th:src="@{/js/lib/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/layout.js}"></script>
<script th:src="@{/js/admin/table-freeze.js}"></script>
<script th:src="@{/js/admin/table-sort.js}"></script>
<script th:src="@{/js/admin/table-polish.js}"></script>
<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
