<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/company-icon.png}">
    <title>MARIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <th:block layout:fragment="pageStyles"></th:block>
</head>
<body>
<div class="app-shell">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-mark"></div>
            <div class="sidebar-brand-name">리턴증권 MARIA</div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-group-label">심사 · 계좌</div>
            <div class="sidebar-items">
                <a class="sidebar-item" th:href="@{/admin/account}"
                   th:classappend="${activePath == '/admin/account'} ? ' active' : ''">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.4"><circle cx="7" cy="4.5" r="2.5"/><path d="M2 13c0-3 2.2-4.5 5-4.5s5 1.5 5 4.5"/></svg>
                        계좌 관리
                    </span>
                    <span id="accountReviewBadge" class="sidebar-badge" style="display:none"></span>
                </a>
            </div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-group-label">입고 · 매도</div>
            <div class="sidebar-items">
                <a class="sidebar-item" th:href="@{/admin/inbound}"
                    th:classappend="${activePath == '/admin/inbound'} ? ' active' : ''">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><polyline points="2,6 7,2 12,6"/><line x1="7" y1="2" x2="7" y2="10"/><line x1="2" y1="10" x2="12" y2="10"/><line x1="2" y1="12" x2="12" y2="12"/></svg>
                        입고 관리
                    </span>
                </a>
                <a class="sidebar-item"
                   th:classappend="${activePath == '/admin/sell-orders'} ? ' active' : ''"
                   th:href="@{/admin/sell-orders}">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><line x1="2" y1="5" x2="10" y2="5"/><polyline points="7,2 10,5 7,8"/><line x1="12" y1="9" x2="4" y2="9"/><polyline points="7,12 4,9 7,6"/></svg>
                        매도 · 환전
                    </span>
                </a>
                <a class="sidebar-item"
                   th:classappend="${activePath == '/admin/settlement'} ? ' active' : ''"
                   th:href="@{/admin/settlement}">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.6"><line x1="2" y1="12" x2="2" y2="7"/><line x1="7" y1="12" x2="7" y2="4"/><line x1="12" y1="12" x2="12" y2="9"/></svg>
                        정산 배치
                    </span>
                </a>
            </div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-group-label">세금 · 리스크</div>
            <div class="sidebar-items">
                <a class="sidebar-item" th:href="@{/admin/tax}"
                   th:classappend="${activePath == '/admin/tax'} ? ' active' : ''">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><rect x="2" y="1" width="10" height="12" rx="1"/><line x1="4.5" y1="4.5" x2="9.5" y2="4.5"/><line x1="4.5" y1="7" x2="9.5" y2="7"/><line x1="4.5" y1="9.5" x2="7.5" y2="9.5"/></svg>
                        세액 계산
                    </span>
                </a>
                <a class="sidebar-item" th:href="@{/admin/target-products}"
                    th:classappend="${activePath == '/admin/target-products'} ? ' active' : ''">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><circle cx="6" cy="6" r="4"/><line x1="9" y1="9" x2="12.5" y2="12.5"/></svg>
                        외부 감시
                    </span>
                </a>
            </div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-group-label">자산 · 인출</div>
            <div class="sidebar-items">
                <a class="sidebar-item" th:href="@{/admin/domestic-investment}"
                   th:classappend="${activePath == '/admin/domestic-investment'} ? ' active' : ''">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><rect x="1.5" y="7" width="3" height="5"/><rect x="5.5" y="4" width="3" height="8"/><rect x="9.5" y="1.5" width="3" height="10.5"/></svg>
                        국내투자 현황
                    </span>
                </a>
                <span class="sidebar-item disabled">
                </span>
                <a class="sidebar-item"
                   th:classappend="${activePath == '/admin/withdrawals'} ? ' active' : ''"
                   th:href="@{/admin/withdrawals}">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><path d="M2 3h10v8H2z"/><path d="M4 7h6"/><path d="M8 5l2 2-2 2"/></svg>
                        인출 관리
                    </span>
                </a>
                <a class="sidebar-item"
                   th:classappend="${activePath == '/admin/account-closures'} ? ' active' : ''"
                   th:href="@{/admin/account-closures}">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><circle cx="7" cy="7" r="6"/><line x1="7" y1="4" x2="7" y2="9"/><polyline points="4.5,7 7,9.5 9.5,7"/></svg>
                        계좌 해지 관리
                    </span>
                </a>

            </div>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-group-label">시스템</div>
            <div class="sidebar-items">
                <a class="sidebar-item"
                   th:classappend="${activePath == '/admin/dashboard'} ? ' active' : ''"
                   th:href="@{/admin/dashboard}">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.4"><rect x="1" y="1" width="5" height="5"/><rect x="8" y="1" width="5" height="5"/><rect x="1" y="8" width="5" height="5"/><rect x="8" y="8" width="5" height="5"/></svg>
                        대시보드
                    </span>
                </a>
                <a class="sidebar-item"
                   th:classappend="${activePath == '/admin/audit-log'} ? ' active' : ''"
                   th:href="@{/admin/audit-log}">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><line x1="2" y1="3.5" x2="12" y2="3.5"/><line x1="2" y1="7" x2="12" y2="7"/><line x1="2" y1="10.5" x2="8" y2="10.5"/></svg>
                        감사 로그
                    </span>
                </a>
                <a class="sidebar-item"
                   th:classappend="${activePath == '/admin/admin-users'} ? ' active' : ''"
                   th:href="@{/admin/admin-users}">
                    <span class="sidebar-item-label">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#e2e8f0" stroke-width="1.3"><circle cx="7" cy="7" r="2.3"/><circle cx="7" cy="7" r="5.5"/></svg>
                        관리자
                    </span>
                </a>
            </div>
        </div>
    </aside>

    <div class="main-area">
        <header class="topbar">
            <div class="breadcrumb">
                <span>리턴증권 RIA</span>
                <span>&rsaquo;</span>
                <span class="breadcrumb-current" layout:fragment="breadcrumb">페이지</span>
            </div>
            <div class="topbar-actions">
                <button type="button" class="clock-badge" id="clockButton" disabled>
                    <span class="clock-badge-label">기준 시각</span>
                    <span class="clock-badge-value" id="clockValue">-</span>
                </button>
                <div class="topbar-divider"></div>
                <div class="admin-badge">
                    <span id="adminBadge">-</span>
                </div>
                <div class="topbar-divider"></div>
                <button type="button" class="theme-toggle" id="themeToggle">☀</button>
                <span class="logout-link" id="logoutLink">로그아웃</span>
            </div>
        </header>

        <main class="content">
            <div layout:fragment="content">페이지 내용이 여기 들어갑니다.</div>
        </main>
    </div>

</div>

<div class="clock-modal-backdrop" id="clockModal" hidden>
    <section class="clock-modal" role="dialog" aria-modal="true" aria-labelledby="clockModalTitle">
        <div class="clock-modal-header">
            <div>
                <h2 id="clockModalTitle">시스템 업무시각 설정</h2>
                <p>설정한 시각부터 시스템 업무시각이 계속 흐릅니다.</p>
            </div>
            <button type="button" class="clock-modal-close" id="clockModalClose" aria-label="닫기">&times;</button>
        </div>

        <div class="clock-modal-body">
            <label for="clockDatetime">변경할 업무시각</label>
            <input type="datetime-local" id="clockDatetime" step="60">

            <label for="clockReasonCode">변경 사유</label>
            <input type="text" id="clockReasonCode" maxlength="50"
                   placeholder="예: DEMO_TIME_CHANGE">
            <p class="clock-modal-help">변경 이력은 감사로그에 기록됩니다.</p>
        </div>

        <div class="clock-modal-actions">
            <button type="button" class="clock-modal-cancel" id="clockModalCancel">취소</button>
            <button type="button" class="clock-modal-apply" id="clockApplyButton">업무시각 적용</button>
        </div>
    </section>
</div>

<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<script th:src="@{/js/lib/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/layout.js}"></script>
<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
