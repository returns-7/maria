<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/statistics.css}">
        <link rel="stylesheet" th:href="@{/css/audit-log.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">감사 로그</div>

<div layout:fragment="content" class="audit-log">
    <div class="audit-log-header">
        <h1 class="audit-log-title">감사 로그</h1>
        <span class="audit-log-count" id="auditLogCount">-</span>
    </div>

    <div class="card audit-log-toolbar">
        <div class="audit-log-filter-row">
            <select id="auditTargetTableFilter" class="audit-log-filter">
                <option value="">작업유형</option>
                <option value="ADMIN_USER">관리자</option>
                <option value="SELL_ORDER">매도주문</option>
                <option value="SYSTEM_CLOCK">시스템 시각</option>
                <option value="ACCOUNT">계좌</option>
                <option value="SETTLEMENT_BATCH">정산배치</option>
                <option value="SETTLEMENT_ITEM">정산항목</option>
            </select>
            <input id="auditStartDateFilter" class="audit-log-filter" type="datetime-local">
            <span class="audit-log-filter-separator">~</span>
            <input id="auditEndDateFilter" class="audit-log-filter" type="datetime-local">
        </div>
        <div class="audit-log-filter-row">
            <input id="auditAdminKeywordFilter" class="audit-log-filter audit-log-search-input" type="text"
                   placeholder="관리자 (이름/역할)">
            <input id="auditTargetKeywordFilter" class="audit-log-filter audit-log-search-input" type="text"
                   placeholder="대상 (이름/계좌번호)">
            <input id="auditReasonKeywordFilter" class="audit-log-filter audit-log-search-input" type="text"
                   placeholder="사유">
            <div class="audit-log-filter-actions">
                <button id="auditLogSearch" class="btn btn-primary" type="button">조회</button>
                <button id="auditLogReset" class="btn" type="button">초기화</button>
            </div>
        </div>
    </div>

    <div class="card audit-log-table-wrap">
        <table class="audit-log-table">
            <thead>
            <tr>
                <th>일시</th>
                <th>관리자</th>
                <th>작업유형</th>
                <th>대상</th>
                <th>사유</th>
                <th>변경 전</th>
                <th>변경 후</th>
            </tr>
            </thead>
            <tbody id="auditLogListBody">
            <tr>
                <td colspan="7" class="audit-log-loading">불러오는 중...</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="audit-log-pagination" id="auditLogPagination"></div>
</div>

<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/audit-log.js}"></script>
</th:block>
</body>
</html>
