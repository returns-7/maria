<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RIA 관리 시스템 로그인 · Returns.</title>
    <link rel="icon" type="image/png" th:href="@{/images/admin/favicon.png}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/admin/login.css}">
</head>
<body class="adm-login-body">
<div class="adm-login" id="admLogin">

    <aside class="adm-login-brand">
        <img class="adm-login-wordmark" th:src="@{/images/admin/logo-wordmark-white.png}"
             alt="Returns. MORE VALUE TOMORROW">
        <div class="adm-login-brand-body">
            <div class="adm-login-brand-eyebrow">RIA ADMIN</div>
            <div class="adm-login-brand-title">RIA 관리 시스템</div>
        </div>
        <div class="adm-login-character">
            <img th:src="@{/images/admin/char-front.png}" alt="">
            <span class="adm-login-character-shadow"></span>
        </div>
    </aside>

    <div class="adm-login-fontsize" role="group" aria-label="글자 크기">
        <button type="button" data-fs-step="-1" title="글자 크기" aria-label="글자 작게">가-</button>
        <button type="button" data-fs-step="reset" title="글자 크기" aria-label="글자 보통">가</button>
        <button type="button" data-fs-step="1" title="글자 크기" aria-label="글자 크게">가+</button>
    </div>

    <section class="adm-login-form-area">
        <form id="loginForm" class="adm-login-form" novalidate>
            <div class="adm-login-eyebrow">ADMIN SIGN IN</div>
            <h1 class="adm-login-heading">관리자 <span>로그인</span></h1>

            <label class="adm-login-field adm-login-field-first" for="loginId">아이디
                <input type="text" id="loginId" name="loginId" autocomplete="username"
                       placeholder="관리자 아이디" required>
            </label>
            <label class="adm-login-field" for="password">비밀번호
                <input type="password" id="password" name="password" autocomplete="current-password"
                       placeholder="비밀번호" required>
            </label>

            <div class="adm-login-error-slot">
                <div id="loginError" class="adm-login-error" role="alert" style="display:none"></div>
            </div>

            <button type="submit" id="loginSubmit" class="adm-login-submit">
                <span class="adm-login-spinner" id="loginSpinner" hidden></span>
                <span id="loginSubmitLabel">로그인</span>
            </button>


            <!-- "고객 사이트로" 링크 자리. 이동할 고객 웹 주소가 정해지면 href를 채우고 hidden을 지운다. -->
            <div class="adm-login-links" hidden>
                <a id="customerSiteLink" href="#">고객 사이트로</a>
            </div>
        </form>
    </section>
</div>

<script th:src="@{/js/lib/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/login.js}"></script>
<script th:src="@{/js/admin/login-ui.js}"></script>
</body>
</html>
