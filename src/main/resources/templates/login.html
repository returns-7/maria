<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">
<div class="login-card card">
    <div class="login-brand">
        <div class="sidebar-brand-mark" style="background:#4a6690"></div>
        <div class="login-title">리턴증권 RIA</div>
    </div>
    <form id="loginForm">
        <label class="login-label" for="loginId">아이디</label>
        <input class="login-input" type="text" id="loginId" name="loginId" autocomplete="username" required>

        <label class="login-label" for="password">비밀번호</label>
        <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" required>

        <div id="loginError" class="login-error" style="display:none"></div>

        <button type="submit" class="btn btn-primary login-submit">로그인</button>
    </form>
</div>

<script th:src="@{/js/lib/jquery-3.7.1.min.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
