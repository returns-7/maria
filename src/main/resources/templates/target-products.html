<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/target-products.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">외부 감시</div>
<div layout:fragment="content">
    <div id="tpLoading" class="dash-loading">불러오는 중...</div>
    <div id="tpError" class="dash-error" style="display:none"></div>
    <div id="tpBody" style="display:none">
        <div class="kpi-grid">
            <div class="card kpi-card">
                <div class="kpi-label">오늘 판정 건수</div>
                <div class="kpi-value" id="kpiTodayJudgement">-</div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-label">오늘 대상상품 건수</div>
                <div class="kpi-value" id="kpiTodayTarget">-</div>
            </div>
            <div class="card kpi-card kpi-card-danger">
                <div class="kpi-label">오늘 대상상품 순매수 합계</div>
                <div class="kpi-value kpi-value-danger kpi-value-amount" id="kpiTodayTargetAmount">-</div>
            </div>
            <div class="card kpi-card">
                <div class="kpi-label">누적 판정 건수</div>
                <div class="kpi-value" id="kpiTotalJudgement">-</div>
            </div>
        </div>
        <div class="card filter-bar">
            <input type="text" id="tpFilterCustomerName" class="filter-input" placeholder="고객명 검색">
            <select id="tpFilterStockType" class="filter-select">
                <option value="">전체 종목구분</option>
                <option value="FOREIGN_STOCK">해외주식</option>
                <option value="ETF">ETF</option>
                <option value="ETN">ETN</option>
                <option value="FUND">펀드</option>
            </select>
            <select id="tpFilterIsTarget" class="filter-select">
                <option value="">전체 대상여부</option>
                <option value="true">대상</option>
                <option value="false">비대상</option>
            </select>
            <button type="button" id="tpFilterSubmit" class="btn btn-primary">검색</button>
            <button type="button" id="tpFilterReset" class="btn">초기화</button>
        </div>
        <div class="card">
            <div class="section-header">
                <span>외부 순매수 판정 목록</span>
                <span class="section-sub">myData 연동, 최신순</span>
            </div>
            <table class="dash-table">
                <thead>
                <tr>
                    <th>판정일시</th>
                    <th>고객명</th>
                    <th>종목구분</th>
                    <th>종목/펀드</th>
                    <th>거래유형</th>
                    <th>거래금액</th>
                    <th>순매수금액</th>
                    <th>대상상품</th>
                </tr>
                </thead>
                <tbody id="tpTableBody">
                <tr>
                    <td colspan="8" class="dash-empty">불러오는 중...</td>
                </tr>
                </tbody>
            </table>
            <div id="tpPagination" class="pagination"></div>
        </div>
    </div>
</div>
<th:block layout:fragment="pageScripts">
    <script th:src="@{/js/target-products.js}"></script>
</th:block>
</body>
</html>
