<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>MARIA</title>
    <th:block layout:fragment="pageStyles">
        <link rel="stylesheet" th:href="@{/css/statistics.css}">
    </th:block>
</head>
<body>
<div layout:fragment="breadcrumb">통계보드</div>

<div layout:fragment="content">
    <div class="dash-stat">
        <div class="filter-bar dash-stat-filter-bar">
            <input id="statFilterKeyword" class="filter-input dash-stat-filter-keyword" type="text"
                   placeholder="계좌번호 또는 고객명" autocomplete="off">
            <input id="statFilterProductName" class="filter-input dash-stat-filter-input" type="text"
                   placeholder="종목명" autocomplete="off">
            <input id="statFilterStartDate" class="filter-input dash-stat-filter-date" type="date">
            <span class="dash-stat-filter-date-separator">~</span>
            <input id="statFilterEndDate" class="filter-input dash-stat-filter-date" type="date">
            <button type="button" id="statFilterSearch" class="btn btn-primary">조회</button>
            <button type="button" id="statFilterReset" class="btn">초기화</button>
        </div>
        <p id="dashStatError" class="dash-stat-error" style="display:none"></p>

        <div class="dash-stat-grid">
            <div class="card dash-stat-card">
                <div class="section-header">세제혜택 상태 분포</div>
                <div class="dash-stat-chart-wrap">
                    <canvas id="accountBenefitChart"></canvas>
                </div>
                <div id="accountBenefitEmpty" class="dash-stat-empty" style="display:none">데이터가 없습니다.</div>
            </div>

            <div class="card dash-stat-card">
                <div class="section-header">나이대별 투자 비중</div>
                <div class="dash-stat-chart-wrap">
                    <canvas id="ageInvestmentChart"></canvas>
                </div>
                <div id="ageInvestmentEmpty" class="dash-stat-empty" style="display:none">데이터가 없습니다.</div>
            </div>

            <div class="card dash-stat-card">
                <div class="section-header">종목별 매수 비중</div>
                <div class="dash-stat-chart-wrap">
                    <canvas id="productPurchaseChart"></canvas>
                </div>
                <div id="productPurchaseEmpty" class="dash-stat-empty" style="display:none">데이터가 없습니다.</div>
            </div>

            <div class="card dash-stat-card dash-stat-card-wide">
                <div class="section-header">감면율 구간별 매도금액 분포</div>
                <div class="dash-stat-chart-wrap">
                    <canvas id="reliefRateChart"></canvas>
                </div>
                <div id="reliefRateEmpty" class="dash-stat-empty" style="display:none">데이터가 없습니다.</div>
            </div>

            <div class="card dash-stat-card dash-stat-card-wide">
                <div class="section-header">외화유입 · 원화환전 추이</div>
                <div class="dash-stat-chart-wrap">
                    <canvas id="fxExchangeChart"></canvas>
                </div>
                <div id="fxExchangeEmpty" class="dash-stat-empty" style="display:none">데이터가 없습니다.</div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="pageScripts">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
            integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
            crossorigin="anonymous"></script>
    <script th:src="@{/js/statistics.js}"></script>
</th:block>
</body>
</html>
