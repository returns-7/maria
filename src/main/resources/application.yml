server:
  port: 10000
  error:
    whitelabel:
      enabled: false
logging:
  level:
    root: WARN
    com.app.maria: INFO
    org.springframework.web: WARN
spring:
  config:
    # 비밀값은 프로젝트 루트의 .env에서 읽는다(git 제외)
    # 서버에서는 파일 없이 환경변수로 주입하므로 optional
    import: optional:file:.env[.properties]
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10      # 최대 커넥션 수
      minimum-idle: 5            # 최소 유지 커넥션
      connection-timeout: 30000  # 커넥션 획득 대기 시간(ms)
      idle-timeout: 600000       # 유휴 커넥션 유지 시간(ms)
      initialization-fail-timeout: -1
  # 켜 두면 JPA 커넥션을 응답이 끝날 때까지 쥔다. risk처럼 느린 외부 호출을 기다리는 요청이 쌓이면 풀이 바닥나 다른 화면이 멈춘다
  jpa:
    open-in-view: false
  # DevTools
  devtools:
    restart:
      exclude: "**/domain/**"
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 60000
  cache:
    type: redis
  # Spring AI — 끼루 챗봇
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
# MyBatis
mybatis:
  # Mapper XML 위치
  mapper-locations: classpath*:mappers/**/*.xml
  # DTO / VO / Entity alias 패키지
  type-aliases-package: com.app.maria.domain
  configuration:
    # DB snake_case → Java camelCase
    # ACCOUNT_NO → accountNo
    map-underscore-to-camel-case: true
    # null 처리
    jdbc-type-for-null: NULL
    # 개발용 SQL 로그
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /api-docs
app:
  cookie:
    secure: ${SECURE_COOKIE:false}
  ci:
    pepper: ${CI_PEPPER}  # 시드·myData·증권사와 같은 값(환경변수 주입)
jwt:
  secret: ${JWT_SECRET}  # Access Token 만료: 20분
  expiration_minute: 20  # Refresh Token 만료: 7일
  refresh_expiration_day: 7
  token-blacklist-prefix: "blacklist:"
  refresh-blacklist-prefix: "refresh:"
# api
custom:
  internal:
    # 증권사 거래 생성기 호출용 비밀 헤더 값과 제외 고객(ci_hash, 쉼표 구분). 값은 서버 환경변수로만 준다.
    secret: ${INTERNAL_SECRET:}
    excluded-ci-hashes: ${INTERNAL_EXCLUDED_CI_HASHES:}
  market:
    # securities = 증권사(return-securities) 저장 시세(기본), kis = KIS·환율 API
    source: ${MARKET_SOURCE:securities}
  risk:
    url: ${RISK_URL:http://risk:8000}
    service-key: ${RISK_SERVICE_KEY:}
    calendar-path: ${RISK_CALENDAR_PATH:}
    trading-hours-path: ${RISK_TRADING_HOURS_PATH:}
    # Must match Python calendar-status.calendarVersion for the identical bytes.
    expected-calendar-version: ${RISK_CALENDAR_VERSION:}
    sync-enabled: ${RISK_SYNC_ENABLED:false}
    poll-interval: ${RISK_POLL_INTERVAL:PT5M}
    retry-delay: ${RISK_RETRY_DELAY:PT1M}
    max-retries: ${RISK_MAX_RETRIES:3}
    # 0 = until midnight KST; e.g. PT1H stops one hour after the actual close.
    cutoff-after-close: ${RISK_CUTOFF_AFTER_CLOSE:PT0S}
    tick-millis: ${RISK_TICK_MILLIS:30000}
    # 현재 주식 위험등급 캐시. 시연 환경은 RISK_CURRENT_CACHE_TTL_SECONDS=21600,
    # RISK_CURRENT_CACHE_MAX_TICKERS=500 권장(첫 호출 이후 응답이 0.5초대).
    current-stock-cache-ttl-seconds: ${RISK_CURRENT_CACHE_TTL_SECONDS:60}
    current-stock-cache-max-tickers: ${RISK_CURRENT_CACHE_MAX_TICKERS:77}
  opendart:
    url: https://opendart.fss.or.kr/api
    # 비어 있으면 OpenDART 도구가 꺼진다(오류가 아님). 키는 환경변수로만 받는다.
    api-key: ${OPENDART_API_KEY:}
  exchange:
    name: exchange-money
    url: https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON
    api-key: ${EXIM_API_KEY}
    max-retries: 2
    initial-backoff: 1000
  external-trade-sync:
    max-judge-failure-days: 3
  price:
    name: korea-investment
    url: https://openapivts.koreainvestment.com:29443
    app-key: ${KIS_APP_KEY}
    app-secret: ${KIS_APP_SECRET}
  returns-security:
    url: ${RETURNS_SECURITY_URL}
  mydata:
    url: ${MYDATA_URL}
    own-broker-name: 리턴증권
  settlement:
    cron: "0 0 0 * * *"
    zone: "Asia/Seoul"
  tax:
    # 정산(00:00) · myData 동기화(01:00) 이후에 돌아야 그날 데이터가 반영된다
    snapshot-cron: "0 0 2 * * *"
    zone: "Asia/Seoul"
    year: 2026
sql:
  init:
    mode: never
management:
  health:
    redis:
      enabled: false
kkiru:
  docs:
    path: classpath:kkiru/docs/RIA_RAG_지식문서*.txt
news:
  provider: ${NEWS_PROVIDER:free}
  free-news-api-key: ${FREENEWS_API_KEY:}
  live-summaries: ${NEWS_LIVE_SUMMARIES:true}
  live-questions: ${NEWS_LIVE_QUESTIONS:true}
  question-max-requests-per-minute: ${NEWS_QUESTION_MAX_REQUESTS_PER_MINUTE:20}
  model: ${NEWS_MODEL:gpt-4o-mini}
  naver-client-id: ${NEWS_NAVER_CLIENT_ID:}
  naver-client-secret: ${NEWS_NAVER_CLIENT_SECRET:}
  summary-cache-ttl: ${NEWS_SUMMARY_CACHE_TTL:PT24H}
  summary-cache-max-entries: ${NEWS_SUMMARY_CACHE_MAX_ENTRIES:1024}
  source-cache-ttl: ${NEWS_SOURCE_CACHE_TTL:PT2H}
  inventory-cache-ttl: ${NEWS_INVENTORY_CACHE_TTL:PT30M}
  source-monthly-request-limit: ${NEWS_SOURCE_MONTHLY_REQUEST_LIMIT:2400}
  prewarm-enabled: ${NEWS_PREWARM_ENABLED:true}
  prewarm-interval-ms: ${NEWS_PREWARM_INTERVAL_MS:300000}
  prewarm-max-stocks-per-run: ${NEWS_PREWARM_MAX_STOCKS_PER_RUN:20}
  prewarm-max-generations-per-run: ${NEWS_PREWARM_MAX_GENERATIONS_PER_RUN:20}
